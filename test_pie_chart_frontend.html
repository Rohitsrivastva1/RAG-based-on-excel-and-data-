<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pie Chart Test</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(45, 45, 45, 0.5);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #404040;
        }
        .chart-container {
            background: rgba(45, 45, 45, 0.3);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #404040;
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            color: #00d4aa;
            margin-bottom: 20px;
        }
        .status {
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid rgba(0, 212, 170, 0.3);
            color: #00d4aa;
        }
        .error {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍰 Pie Chart Visualization Test</h1>
        
        <div id="status" class="status">
            Loading test data...
        </div>
        
        <div class="chart-container">
            <div id="chart" style="width: 100%; height: 400px;"></div>
        </div>
        
        <div id="data-info" style="margin-top: 20px; font-size: 14px; color: #8c8c8c;">
            <!-- Data information will be displayed here -->
        </div>
    </div>

    <script>
        // Test data from the backend
        const testData = {
            "type": "pie",
            "data": {
                "data": [
                    {
                        "labels": ["Education", "Entertainment", "Finance", "Health", "Tech"],
                        "values": [2500, 2968, 3964, 3055, 2144],
                        "type": "pie",
                        "marker": {
                            "colors": ["#00d4aa", "#00a8ff", "#ff6b6b", "#4ecdc4", "#45b7d1"],
                            "line": {
                                "color": "#ffffff",
                                "width": 2
                            }
                        },
                        "textinfo": "label+percent",
                        "textposition": "outside",
                        "hovertemplate": "<b>%{label}</b><br>Value: %{value}<br>Percentage: %{percent}<extra></extra>"
                    }
                ],
                "layout": {
                    "title": {
                        "text": "Distribution of Users by Category",
                        "font": { "color": "#ffffff", "size": 16 }
                    },
                    "autosize": true,
                    "margin": { "l": 60, "r": 60, "t": 60, "b": 60 },
                    "showlegend": true,
                    "legend": {
                        "orientation": "v",
                        "x": 1.02,
                        "y": 0.5,
                        "bgcolor": "rgba(0,0,0,0)",
                        "bordercolor": "#404040",
                        "font": { "color": "#ffffff" }
                    },
                    "paper_bgcolor": "rgba(0,0,0,0)",
                    "plot_bgcolor": "rgba(0,0,0,0)",
                    "font": {
                        "color": "#ffffff",
                        "family": "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif"
                    }
                }
            },
            "title": "Distribution of Users by Category"
        };

        function updateStatus(message, isError = false) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${isError ? 'error' : 'success'}`;
        }

        function displayDataInfo() {
            const dataInfo = document.getElementById('data-info');
            const pieData = testData.data.data[0];
            
            dataInfo.innerHTML = `
                <h3>Chart Data:</h3>
                <p><strong>Labels:</strong> ${pieData.labels.join(', ')}</p>
                <p><strong>Values:</strong> ${pieData.values.join(', ')}</p>
                <p><strong>Total Users:</strong> ${pieData.values.reduce((a, b) => a + b, 0).toLocaleString()}</p>
                <p><strong>Chart Type:</strong> ${testData.type}</p>
                <p><strong>Title:</strong> ${testData.title}</p>
            `;
        }

        function renderChart() {
            try {
                updateStatus("Rendering pie chart...");
                
                const plotlyData = testData.data.data;
                const plotlyLayout = {
                    ...testData.data.layout,
                    // Ensure dark theme
                    paper_bgcolor: 'rgba(0,0,0,0)',
                    plot_bgcolor: 'rgba(0,0,0,0)',
                    font: {
                        color: '#ffffff',
                        family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif'
                    }
                };

                Plotly.newPlot('chart', plotlyData, plotlyLayout, {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['pan2d', 'lasso2d', 'select2d'],
                    displaylogo: false,
                    toImageButtonOptions: {
                        format: 'png',
                        filename: 'pie_chart_test',
                        height: 500,
                        width: 700,
                        scale: 1
                    }
                });

                updateStatus("✅ Pie chart rendered successfully!");
                displayDataInfo();
                
            } catch (error) {
                console.error('Error rendering chart:', error);
                updateStatus(`❌ Error rendering chart: ${error.message}`, true);
            }
        }

        // Initialize the chart when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus("Initializing pie chart test...");
            setTimeout(renderChart, 500);
        });
    </script>
</body>
</html>
