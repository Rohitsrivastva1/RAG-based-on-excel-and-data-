[tool:pytest]
# Pytest configuration for RAG Analytics tests

# Test discovery
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for component interactions
    security: Security-related tests
    performance: Performance tests
    slow: Slow-running tests
    database: Tests requiring database connection
    llm: Tests requiring LLM services
    embedding: Tests requiring embedding services
    visualization: Tests requiring visualization libraries

# Test configuration
minversion = 6.0
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Coverage options (if using pytest-cov)
# addopts = --cov=backend --cov-report=html --cov-report=term-missing

# Timeout for tests (if using pytest-timeout)
# timeout = 300

# Parallel execution (if using pytest-xdist)
# addopts = -n auto
